<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>html,body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
<title>Zìwǎng 字网</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600&family=Schibsted+Grotesk:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&text=%E5%AD%97%E7%BD%91&display=swap">
<style>
:root{
  --paper:#F6F8F2; --panel:#FFFFFF; --panel-2:#EDF2E9;
  --grid:#8DBFA3; --grid-soft:#D3E5D9; --line:#DCE5DC;
  --ink:#18221E; --ink-2:#56625B; --ink-3:#8A958E;
  --accent:#1D7556; --accent-soft:#DDEFE5;
  --t1:#C9352B; --t2:#C27208; --t3:#1D8747; --t4:#2A5FC7; --t5:#7C8781;
  --shadow:0 1px 0 rgba(24,34,30,.04),0 8px 24px -12px rgba(24,34,30,.18);
  --cn:"Noto Serif SC","Songti SC","SimSun",serif;
  --ui:"Schibsted Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --paper:#141D19; --panel:#1A2621; --panel-2:#20302A;
    --grid:#3E6553; --grid-soft:#2A3E35; --line:#2B3B34;
    --ink:#EAF0E8; --ink-2:#A6B3AB; --ink-3:#74827A;
    --accent:#7FD3AE; --accent-soft:#23392F;
    --t1:#FF8176; --t2:#F4B24A; --t3:#63D68F; --t4:#86AEFF; --t5:#98A39D;
    --shadow:0 1px 0 rgba(0,0,0,.2),0 10px 28px -14px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --paper:#141D19; --panel:#1A2621; --panel-2:#20302A;
  --grid:#3E6553; --grid-soft:#2A3E35; --line:#2B3B34;
  --ink:#EAF0E8; --ink-2:#A6B3AB; --ink-3:#74827A;
  --accent:#7FD3AE; --accent-soft:#23392F;
  --t1:#FF8176; --t2:#F4B24A; --t3:#63D68F; --t4:#86AEFF; --t5:#98A39D;
  --shadow:0 1px 0 rgba(0,0,0,.2),0 10px 28px -14px rgba(0,0,0,.6);
}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--ui);font-size:15px;line-height:1.5;
  background-image:linear-gradient(var(--grid-soft) 1px,transparent 1px),linear-gradient(90deg,var(--grid-soft) 1px,transparent 1px);
  background-size:48px 48px;background-position:-1px -1px;background-attachment:fixed}
.wrap{max-width:1240px;margin:0 auto;padding-inline:20px;padding-block:18px 40px;display:grid;gap:18px}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.cn{font-family:var(--cn)}
.t1{color:var(--t1)}.t2{color:var(--t2)}.t3{color:var(--t3)}.t4{color:var(--t4)}.t5{color:var(--t5)}

/* header */
header{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:10px;margin-right:auto}
.brand .logo{font-family:"Ma Shan Zheng",var(--cn);font-size:40px;line-height:1;color:var(--ink)}
.brand .name{font-weight:700;letter-spacing:.02em;font-size:18px}
.brand .sub{color:var(--ink-3);font-size:13px}
.search{position:relative;flex:1 1 340px;max-width:520px}
.search input{width:100%;font:inherit;font-size:16px;padding:11px 14px 11px 40px;border-radius:12px;border:1.5px solid var(--line);background:var(--panel);color:var(--ink);box-shadow:var(--shadow)}
.search input:focus{outline:none;border-color:var(--accent)}
.search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--ink-3)}
.results{position:absolute;z-index:30;top:calc(100% + 6px);left:0;right:0;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);max-height:min(70vh,520px);overflow:auto;padding:8px}
.results h4{margin:6px 8px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.rchars{display:flex;flex-wrap:wrap;gap:6px;padding:0 6px 6px}
.rword{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;width:100%;text-align:left;border:0;background:none;padding:7px 8px;border-radius:8px}
.rword:hover,.rword.sel{background:var(--panel-2)}
.rword .cn{font-size:19px;grid-row:span 2}
.rword .py{font-size:13px}
.rword .gl{font-size:13px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.empty{padding:10px;color:var(--ink-3);font-size:14px}
.btn{display:inline-flex;align-items:center;gap:7px;border:1.5px solid var(--line);background:var(--panel);border-radius:10px;padding:8px 13px;font-weight:600;font-size:14px;box-shadow:var(--shadow)}
.btn:hover{border-color:var(--grid)}
.btn.primary{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.btn.on{background:var(--accent-soft);border-color:var(--accent);color:var(--ink)}

/* trail */
.trail{display:flex;align-items:center;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:thin}
.trail .lab{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);font-weight:600;flex:none}
.trail .step{flex:none;font-family:var(--cn);font-size:18px;border:1px solid var(--line);background:var(--panel);border-radius:8px;width:36px;height:36px;display:grid;place-items:center}
.trail .step.cur{border-color:var(--accent);background:var(--accent-soft)}
.trail .arr{color:var(--ink-3);flex:none;font-size:12px}
.linkbtn{border:0;background:none;color:var(--ink-3);font-size:13px;text-decoration:underline;text-underline-offset:3px;flex:none}

/* main */
.main{display:grid;grid-template-columns:minmax(300px,360px) 1fr;gap:18px;align-items:start}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}
.card{padding:20px;display:grid;gap:16px}
.tzg{position:relative;width:min(100%,240px);aspect-ratio:1;margin:0 auto;border:2px solid var(--grid);background:var(--panel)}
.tzg svg.grid{position:absolute;inset:0;width:100%;height:100%}
.tzg #writer{position:absolute;inset:0}
.tzg #writer svg{width:100%;height:100%}
.tzg .fallback{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--cn);font-size:150px;line-height:1}
.ctrl{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.ctrl .btn{padding:7px 11px;font-size:13px}
.head{text-align:center;display:grid;gap:2px}
.head .py{font-size:30px;font-weight:600;letter-spacing:.01em}
.head .def{color:var(--ink-2);font-size:15px;text-wrap:balance}
.facts{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.pill{font-size:12px;font-weight:600;border-radius:999px;padding:3px 10px;background:var(--panel-2);color:var(--ink-2);border:1px solid var(--line);font-variant-numeric:tabular-nums}
.pill.lv{background:var(--accent-soft);color:var(--ink);border-color:transparent}
.sect h3{margin:0 0 8px;font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.parts{display:flex;gap:8px;flex-wrap:wrap}
.part{display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:var(--paper);border-radius:12px;padding:6px 12px 6px 6px;text-align:left}
.part:hover{border-color:var(--grid)}
.part .g{font-family:var(--cn);font-size:26px;width:40px;height:40px;display:grid;place-items:center;background:var(--panel);border-radius:8px;border:1px dashed var(--grid)}
.part .m{display:grid;line-height:1.25}
.part .m b{font-size:13px;font-weight:600}
.part .m small{font-size:12px;color:var(--ink-2);max-width:150px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.role{font-size:10px;letter-spacing:.07em;text-transform:uppercase;font-weight:700;border-radius:4px;padding:1px 5px;justify-self:start}
.role.sound{background:color-mix(in srgb,var(--t4) 16%,transparent);color:var(--t4)}
.role.meaning{background:color-mix(in srgb,var(--t2) 18%,transparent);color:var(--t2)}
.story{font-size:14px;color:var(--ink-2);margin:0;line-height:1.55}
.story .cn{color:var(--ink);font-size:16px}

/* graph */
.graphp{position:relative;overflow:hidden;min-height:420px}
.gtop{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:14px 16px 0}
.gtop h2{margin:0;font-size:15px;font-weight:600;margin-right:auto}
.gtop h2 .cn{font-size:18px}
#graph{display:block;width:100%}
#graph text{font-family:var(--cn)}
.gnode{cursor:pointer}
.gnode .bg{fill:var(--panel);stroke:var(--line);stroke-width:1.2;transition:stroke .15s,fill .15s}
.gnode:hover .bg,.gnode:focus .bg{stroke:var(--accent);fill:var(--accent-soft)}
.gnode:focus{outline:none}
.gword .w{font-size:21px;fill:var(--ink)}
#graph .gword .p{font-size:11.5px;font-family:var(--ui)}
.gchar .c{font-size:21px;fill:var(--ink)}
.gcenter .c{font-size:54px;fill:var(--ink);font-weight:600}
.gcenter .bg{fill:var(--panel);stroke:var(--grid);stroke-width:2.5}
.gline{stroke:var(--grid);stroke-width:1.4;fill:none}
.gline.out{stroke-dasharray:3 4;opacity:.8}
.gline.hi{stroke:var(--accent);stroke-width:2.2;opacity:1}
.moving{transition:transform .7s cubic-bezier(.2,.8,.2,1),opacity .5s}
.fade{transition:opacity .6s .25s}
.caption{position:absolute;left:16px;right:16px;bottom:14px;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:14px;pointer-events:none;box-shadow:var(--shadow)}
.caption .cn{font-size:19px}
.caption .gl{color:var(--ink-2)}
.hint{color:var(--ink-3);font-size:13px}

/* lower */
.lower{display:grid;grid-template-columns:1fr minmax(280px,380px);gap:18px;align-items:start}
.words{padding:18px 20px}
.words .top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.words .top h2{margin:0 auto 0 0;font-size:18px}
.words .top h2 .cn{font-size:22px}
.lvbar{display:flex;gap:4px;flex-wrap:wrap;align-items:center}
.lvbar span{font-size:12px;color:var(--ink-3);margin-right:4px}
.lvbar button{border:1px solid var(--line);background:var(--panel);border-radius:7px;padding:3px 8px;font-size:12.5px;font-weight:600;font-variant-numeric:tabular-nums}
.lvbar button.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.lvgroup{margin-top:14px}
.lvgroup h3{display:flex;align-items:center;gap:10px;margin:0 0 4px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.lvgroup h3::after{content:"";flex:1;border-top:1px dashed var(--grid)}
.wrow{display:grid;grid-template-columns:minmax(90px,auto) minmax(90px,160px) 1fr auto;gap:12px;align-items:center;padding:7px 6px;border-radius:8px;border-bottom:1px solid var(--line)}
.wrow:last-child{border-bottom:0}
.wrow.flash{animation:flash 1.6s}
@keyframes flash{0%,40%{background:var(--accent-soft)}100%{background:transparent}}
.wrow .w{font-family:var(--cn);font-size:22px;display:flex;flex-wrap:wrap}
.wrow .w button{border:0;background:none;padding:0 1px;border-radius:4px;line-height:1.3}
.wrow .w button:hover{background:var(--panel-2)}
.wrow .w .me{text-decoration:underline;text-decoration-color:var(--grid);text-underline-offset:5px;text-decoration-thickness:2px}
.wrow .py{font-size:14px}
.wrow .gl{font-size:14px;color:var(--ink-2)}
.quiz .wrow .gl{filter:blur(5px);cursor:pointer;user-select:none;transition:filter .2s}
.quiz .wrow .gl.shown{filter:none}
.spk{border:0;background:none;color:var(--ink-3);padding:4px;border-radius:6px;display:grid;place-items:center}
.spk:hover{color:var(--accent);background:var(--panel-2)}
.more{margin:6px 0 0 6px}
.fam{padding:18px;display:grid;gap:18px}
.fam p.why{margin:-4px 0 8px;font-size:13px;color:var(--ink-3)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:grid;justify-items:center;border:1px solid var(--line);background:var(--paper);border-radius:9px;padding:4px 6px 3px;min-width:46px;line-height:1.15}
.chip:hover{border-color:var(--accent);background:var(--accent-soft)}
.chip .cn{font-size:22px}
.chip small{font-size:11px}
footer{color:var(--ink-3);font-size:12.5px;line-height:1.6;max-width:80ch}
footer a{color:inherit}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:10px;font-size:14px;opacity:0;transition:.25s;pointer-events:none;z-index:50;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media (max-width:900px){.main,.lower{grid-template-columns:1fr}}
@media (max-width:560px){
  .wrap{padding-inline:16px}
  .brand .sub{display:none}
  .wrow{grid-template-columns:1fr auto;gap:2px 10px}
  .wrow .w{grid-column:1}.wrow .spk{grid-column:2;grid-row:1 / span 3}
  .wrow .py,.wrow .gl{grid-column:1}
}
@media (prefers-reduced-motion:reduce){.moving,.fade{transition:none}.wrow.flash{animation:none}}
</style>

</head>
<body>
<div class="wrap">
  <header>
    <div class="brand"><span class="logo" aria-hidden="true">字网</span><span class="name">Zìwǎng</span><span class="sub">a web of characters</span></div>
    <div class="search">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" autocomplete="off" spellcheck="false" placeholder="Search 电, dian, dian4, or “electric”" aria-label="Search by character, pinyin or English">
      <div class="results" id="results" hidden></div>
    </div>
    <button class="btn" id="wander" title="Jump to a random HSK 1–3 character">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M16 3h5v5M4 20 21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/></svg>Wander</button>
  </header>

  <nav class="trail" id="trail" aria-label="Characters you have visited"></nav>

  <section class="main">
    <article class="panel card" id="card"></article>
    <div class="panel graphp">
      <div class="gtop">
        <h2 id="gtitle">Word web</h2>
        <button class="btn" id="tonechars" title="Colour characters by tone">Tone colours</button>
      </div>
      <svg id="graph" role="img" aria-label="Network of words containing this character"></svg>
      <div class="caption" id="caption"><span class="hint">Tap a word to hear it. Tap an outer character to travel there.</span></div>
    </div>
  </section>

  <section class="lower">
    <div class="panel words" id="wordsPanel">
      <div class="top">
        <h2 id="wtitle">Words</h2>
        <button class="btn" id="quizbtn" title="Blur the English so you can test yourself">Hide English</button>
      </div>
      <div class="lvbar" id="lvbar"></div>
      <div id="wlist"></div>
    </div>
    <aside class="panel fam" id="fam"></aside>
  </section>

  <footer id="foot"></footer>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="https://cdn.jsdelivr.net/npm/hanzi-writer@3.7.3/dist/hanzi-writer.min.js"></script>
<script>

<script>
(()=>{
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const store={get(k,d){try{const v=localStorage.getItem('ziwang.'+k);return v==null?d:JSON.parse(v)}catch(e){return d}},
  set(k,v){try{localStorage.setItem('ziwang.'+k,JSON.stringify(v))}catch(e){}}};
const LVNAME=l=>l>=7?'HSK 7–9':'HSK '+l;
const HAN=/[\u3400-\u9fff\u2e80-\u2fdf]/;

/* ---------- pinyin helpers ---------- */
const MARK={'\u0304':1,'\u0301':2,'\u030c':3,'\u0300':4};
function sylTone(s){const n=s.normalize('NFD');for(const ch of n)if(MARK[ch])return MARK[ch];return 5}
function sylPlain(s){return s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase()}
function pyHTML(py){return py.split(' ').map(s=>`<span class="t${sylTone(s)}">${esc(s)}</span>`).join(' ')}
function pyHTMLJoined(py){return py.split(' ').map(s=>`<span class="t${sylTone(s)}">${esc(s)}</span>`).join('')}

/* ---------- data ---------- */
const WORDS=WORDS_TSV.split('\n').map((l,i)=>{const [w,py,gl,lv]=l.split('\t');
  const syl=py.split(' ');const plain=syl.map(sylPlain);
  return {i,w,py,gl,lv:+lv,syl,key:plain.join('').replace(/ü/g,'v'),nkey:plain.map((p,k)=>p.replace(/ü/g,'v')+sylTone(syl[k])).join(''),glLow:gl.toLowerCase()}});
const WORDMAP=new Map(WORDS.map(w=>[w.w,w]));
const CH={};for(const [c,a] of Object.entries(CHARS)){CH[c]={c,py:a[0]?a[0].split(','):[],def:a[1],parts:[...a[2]],rad:a[3],type:a[4],hint:a[5],ph:a[6],se:a[7],words:[],kids:[],lv:99}}
for(const w of WORDS){for(const c of new Set(w.w)){const o=CH[c];if(o){o.words.push(w.i);if(w.lv<o.lv)o.lv=w.lv}}}
for(const o of Object.values(CH)){for(const p of o.parts)if(CH[p])CH[p].kids.push(o.c)}
const byLv=(a,b)=>CH[a].lv-CH[b].lv;
for(const o of Object.values(CH))o.kids.sort(byLv);
const phonFam={},semFam={};
for(const o of Object.values(CH)){if(o.lv>7)continue;if(o.ph)(phonFam[o.ph]??=[]).push(o.c);if(o.se)(semFam[o.se]??=[]).push(o.c)}
function charPy(c,wordCtx){const o=CH[c];if(!o)return '';
  const w=WORDMAP.get(c);if(w&&w.syl.length===1)return w.py; return o.py[0]||''}

/* ---------- state ---------- */
let cur=null;
let maxLv=store.get('maxLv',7);
let quiz=store.get('quiz',false);
let toneChars=store.get('toneChars',false);
let trail=store.get('trail',[]);

/* ---------- speech ---------- */
let zhVoice=null;
function pickVoice(){try{const v=speechSynthesis.getVoices();zhVoice=v.find(x=>/zh[-_]CN/i.test(x.lang))||v.find(x=>/^zh/i.test(x.lang)||/Chinese|Mandarin/i.test(x.name))||null}catch(e){}}
try{pickVoice();speechSynthesis.onvoiceschanged=pickVoice}catch(e){}
function speak(t){try{if(!('speechSynthesis' in window))throw 0;pickVoice();
  if(!zhVoice){toast('No Mandarin voice is installed in this browser, so audio is unavailable.');return}
  speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.voice=zhVoice;u.lang=zhVoice.lang;u.rate=.8;speechSynthesis.speak(u)}catch(e){toast('Audio isn’t available in this browser.')}}
const SPK='<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/></svg>';

let tt;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),2600)}

/* ---------- strokes ---------- */
const chunkCache={};
function loadStroke(c){const b=c.codePointAt(0)%40;
  chunkCache[b]??=fetch(`strokes/s${b}.json`).then(r=>{if(!r.ok)throw new Error(r.status);return r.json()}).catch(e=>{delete chunkCache[b];throw e});
  return chunkCache[b].then(d=>{if(!d[c])throw new Error('none');return d[c]})}
let writer=null;
function cssv(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim()}
function makeWriter(c){
  const host=$('#writer');if(!host)return;host.innerHTML='';writer=null;
  const fb=$('#fallback');
  if(!window.HanziWriter){fb.hidden=false;return}
  const size=host.clientWidth||240;
  writer=HanziWriter.create(host,c,{width:size,height:size,padding:size*.06,showOutline:true,
    strokeColor:cssv('--ink'),outlineColor:cssv('--grid-soft'),radicalColor:cssv('--accent'),highlightColor:cssv('--t2'),drawingColor:cssv('--t4'),
    strokeAnimationSpeed:1.1,delayBetweenStrokes:140,showHintAfterMisses:2,
    charDataLoader:(ch,ok,err)=>loadStroke(ch).then(d=>{fb.hidden=true;const n=$('#strokeN');if(n)n.textContent=d.strokes.length+' strokes';ok(d)}).catch(e=>{fb.hidden=false;err(e)})});
}

/* ---------- navigation ---------- */
function go(c,{push=true,flashWord=null}={}){
  if(!c)return;
  cur=c;
  if(push){trail=trail.filter(x=>x!==c);trail.push(c);trail=trail.slice(-24);store.set('trail',trail)}
  store.set('last',c);
  try{history.replaceState(null,'','#u'+c.codePointAt(0).toString(16))}catch(e){}
  renderCard();renderGraph();renderWords();renderFam();renderTrail();
  if(flashWord){const r=document.querySelector(`.wrow[data-w="${CSS.escape(flashWord)}"]`);if(r){r.scrollIntoView({block:'center',behavior:'smooth'});r.classList.add('flash')}}
}
function charBtn(c,cls='chip'){const o=CH[c];const p=o?charPy(c):'';
  return `<button class="${cls}" data-go="${esc(c)}" title="${esc(o?o.def:'')}"><span class="cn">${esc(c)}</span>${p?`<small class="t${sylTone(p)}">${esc(p)}</small>`:''}</button>`}

/* ---------- card ---------- */
const TYPE={pictographic:'Pictograph',ideographic:'Ideograph',pictophonetic:'Sound + meaning'};
function renderCard(){
  const c=cur,o=CH[c]||{c,py:[],def:'',parts:[],words:[],kids:[],lv:99};
  const w=WORDMAP.get(c);
  const pys=(w&&w.syl.length===1)?[w.py,...o.py.filter(p=>p!==w.py)]:o.py;
  const def=(w&&w.syl.length===1)?w.gl:o.def;
  const partsHTML=o.parts.map(p=>{const po=CH[p];const role=p===o.ph?'<span class="role sound">sound</span>':p===o.se?'<span class="role meaning">meaning</span>':'';
    return `<button class="part" data-go="${esc(p)}"><span class="g">${esc(p)}</span><span class="m">${role}<b>${po&&po.py[0]?pyHTML(po.py[0]):'&nbsp;'}</b><small>${esc(po?po.def||'component':'component')}</small></span></button>`}).join('');
  let story='';
  if(o.type==='pictophonetic'&&(o.ph||o.se)){
    const sp=o.ph&&CH[o.ph]?CH[o.ph].py[0]:'';
    story=`${o.se?`<span class="cn">${esc(o.se)}</span> hints at the meaning${o.hint?` (${esc(o.hint)})`:''}`:''}${o.se&&o.ph?', and ':''}${o.ph?`<span class="cn">${esc(o.ph)}</span>${sp?` <span class="t${sylTone(sp)}">${esc(sp)}</span>`:''} hints at the sound`:''}.`;
    story=story.charAt(0).toUpperCase()===story.charAt(0)?story:story;
  }else if(o.hint){story=esc(o.hint).replace(/([\u3400-\u9fff])/g,'<span class="cn">$1</span>')+'.'}
  $('#card').innerHTML=`
    <div class="tzg" aria-label="Stroke order for ${esc(c)}">
      <svg class="grid" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
        <path d="M0 50H100M50 0V100" stroke="var(--grid)" stroke-width=".6" stroke-dasharray="2.2 2" fill="none"/>
        <path d="M0 0L100 100M100 0L0 100" stroke="var(--grid-soft)" stroke-width=".5" stroke-dasharray="1.6 2" fill="none"/>
      </svg>
      <div class="fallback" id="fallback">${esc(c)}</div>
      <div id="writer"></div>
    </div>
    <div class="ctrl">
      <button class="btn" id="anim"><svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 4v16l13-8z"/></svg>Strokes</button>
      <button class="btn" id="practice"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 20l4-1 11-11-3-3L5 16z"/></svg>Write it</button>
      <button class="btn" id="say">${SPK}Listen</button>
    </div>
    <div class="head">
      <div class="py">${pys.length?pys.map(pyHTML).join('<span style="color:var(--ink-3)"> · </span>'):''}</div>
      <div class="def">${esc(def||'')}</div>
    </div>
    <div class="facts">
      ${o.lv<=7?`<span class="pill lv">${LVNAME(o.lv)}</span>`:'<span class="pill">Component</span>'}
      <span class="pill" id="strokeN">– strokes</span>
      ${o.rad&&o.rad!==c?`<span class="pill">Radical <span class="cn">${esc(o.rad)}</span></span>`:''}
      ${o.type?`<span class="pill">${TYPE[o.type]||o.type}</span>`:''}
      <span class="pill">${o.words.length} word${o.words.length===1?'':'s'}</span>
    </div>
    ${o.parts.length?`<div class="sect"><h3>Built from</h3><div class="parts">${partsHTML}</div></div>`:''}
    ${story?`<div class="sect"><h3>How it works</h3><p class="story">${story}</p></div>`:''}`;
  $('#fallback').hidden=true;
  makeWriter(c);
  $('#anim').onclick=()=>{if(writer){writer.cancelQuiz?.();writer.showCharacter();writer.animateCharacter()}};
  $('#practice').onclick=()=>{if(!writer)return;toast('Trace each stroke in order. A hint appears after 2 misses.');
    writer.quiz({onComplete:s=>toast(s.totalMistakes?`Finished with ${s.totalMistakes} miss${s.totalMistakes>1?'es':''}.`:'Perfect. No misses.')})};
  $('#say').onclick=()=>speak(c);
}

/* ---------- graph ---------- */
const NS='http://www.w3.org/2000/svg';
function el(tag,attrs={},parent){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(parent)parent.appendChild(e);return e}
function colorWord(w,wordObj){ // returns array of {ch,cls}
  return [...w].map((ch,k)=>({ch,cls:toneChars&&wordObj&&wordObj.syl.length===w.length?'t'+sylTone(wordObj.syl[k]):''}))}
function renderGraph(){
  const svg=$('#graph');svg.innerHTML='';
  const c=cur,o=CH[c];
  const W=svg.clientWidth||svg.parentNode.clientWidth||700;
  const narrow=W<560;
  const H=narrow?Math.round(W*1.25):Math.max(460,Math.min(620,Math.round(W*.68)));
  svg.setAttribute('viewBox',`0 0 ${W} ${H}`);svg.setAttribute('height',H);
  const cx=W/2,cy=H/2-(narrow?18:14);
  let ring=[],mode='words';
  if(o){ring=o.words.map(i=>WORDS[i]).filter(w=>w.w!==c&&w.lv<=maxLv).slice(0,narrow?8:12);const rest=w=>[...w.w].filter(x=>x!==c).join('')||'~';ring.sort((a,b)=>rest(a).localeCompare(rest(b),'zh'))}
  if(!ring.length&&o&&o.kids.length){mode='kids';ring=o.kids.slice(0,narrow?10:14).map(k=>({w:k,py:charPy(k),gl:CH[k].def,lv:CH[k].lv,syl:[charPy(k)],kid:true}))}
  $('#gtitle').innerHTML=mode==='words'?`Words built with <span class="cn">${esc(c)}</span>`:`Characters that contain <span class="cn">${esc(c)}</span>`;
  const n=ring.length;
  const rx1=W*(narrow?.3:.25),ry1=H*(narrow?.24:.26),rx2=W*(narrow?.43:.43),ry2=H*(narrow?.41:.41);
  const gl=el('g',{},svg),gn=el('g',{},svg);
  const outer=new Map();
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  const place=(g,x,y,delay)=>{g.classList.add('moving');g.style.transform=`translate(${cx}px,${cy}px)`;g.style.opacity=0;g.style.transitionDelay=delay+'ms';
    requestAnimationFrame(()=>requestAnimationFrame(()=>{g.style.transform=`translate(${x}px,${y}px)`;g.style.opacity=1}))};
  const lineEls=[];
  ring.forEach((w,i)=>{
    const a=-Math.PI/2+i*2*Math.PI/Math.max(n,1)+(n%2?0:Math.PI/Math.max(n,1)*0);
    const x=cx+rx1*Math.cos(a),y=cy+ry1*Math.sin(a);
    const L=el('line',{x1:cx,y1:cy,x2:x,y2:y,class:'gline fade'},gl);lineEls.push(L);
    // outer chars
    const others=w.kid?[]:[...new Set(w.w)].filter(ch=>ch!==c&&CH[ch]);
    const spread=Math.min(.17,(2*Math.PI/Math.max(n,1))/(others.length+.6));
    const outs=[];
    others.forEach((ch,j)=>{
      let p=outer.get(ch);
      if(!p){p={sx:0,sy:0,ch,lines:[]};outer.set(ch,p)}
      const b=a+(j-(others.length-1)/2)*spread;p.sx+=Math.cos(b);p.sy+=Math.sin(b);
      const L2=el('line',{x1:x,y1:y,class:'gline out fade'},gl);lineEls.push(L2);outs.push(L2);p.lines.push(L2);
    });
    // word node
    const g=el('g',{class:'gnode gword',tabindex:0,role:'button','aria-label':`${w.w} ${w.py}: ${w.gl}`},gn);
    const fs=narrow?18:21;const tw=Math.max(w.w.length*fs+18,50);
    el('rect',{class:'bg',x:-tw/2,y:-22,width:tw,height:44,rx:10},g);
    const t=el('text',{class:'w','text-anchor':'middle',y:3,'font-size':fs},g);
    colorWord(w.w,w.kid?null:w).forEach(({ch,cls})=>{const s=el('tspan',{},t);s.textContent=ch;if(ch===c)s.setAttribute('font-weight','600');if(cls)s.setAttribute('class',cls);});
    const pt=el('text',{class:'p','text-anchor':'middle',y:17},g);
    w.py.split(' ').forEach((s,k)=>{const sp=el('tspan',{class:'t'+sylTone(s)},pt);sp.textContent=(k?' ':'')+s});
    const show=()=>{L.classList.add('hi');outs.forEach(l=>l.classList.add('hi'));
      $('#caption').innerHTML=`<span class="cn">${esc(w.w)}</span><span>${pyHTML(w.py)}</span><span class="gl">${esc(w.gl)}</span><span class="pill lv">${LVNAME(w.lv)}</span>`};
    const hide=()=>{L.classList.remove('hi');outs.forEach(l=>l.classList.remove('hi'))};
    g.addEventListener('mouseenter',show);g.addEventListener('mouseleave',hide);g.addEventListener('focus',show);g.addEventListener('blur',hide);
    const act=()=>{show();if(w.kid)go(w.w);else speak(w.w)};
    g.addEventListener('click',act);g.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();act()}});
    place(g,x,y,reduce?0:60+i*35);
  });
  for(const p of outer.values()){const b=Math.atan2(p.sy,p.sx);p.x=cx+rx2*Math.cos(b);p.y=cy+ry2*Math.sin(b);p.lines.forEach(l=>{l.setAttribute('x2',p.x);l.setAttribute('y2',p.y)})}
  let k=0;
  for(const p of outer.values()){
    const g=el('g',{class:'gnode gchar',tabindex:0,role:'button','aria-label':`Go to ${p.ch}`},gn);
    el('circle',{class:'bg',r:narrow?17:20},g);
    const t=el('text',{class:'c','text-anchor':'middle',y:narrow?6:7,'font-size':narrow?18:21},g);t.textContent=p.ch;
    const nav=()=>go(p.ch);
    g.addEventListener('click',nav);g.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();nav()}});
    g.addEventListener('mouseenter',()=>{const po=CH[p.ch];$('#caption').innerHTML=`<span class="cn">${esc(p.ch)}</span><span>${pyHTML(charPy(p.ch))}</span><span class="gl">${esc(po?po.def:'')}</span><span class="hint">tap to explore</span>`});
    place(g,p.x,p.y,reduce?0:260+k*18);k++;
  }
  // center
  const g=el('g',{class:'gnode gcenter',tabindex:0,role:'button','aria-label':`Hear ${c}`},gn);
  el('circle',{class:'bg',r:narrow?40:48},g);
  el('circle',{r:narrow?46:55,fill:'none',stroke:'var(--grid-soft)','stroke-width':1,'stroke-dasharray':'2 4'},g);
  const ct=el('text',{class:'c','text-anchor':'middle',y:narrow?15:18,'font-size':narrow?44:54},g);ct.textContent=c;
  const cp=charPy(c);if(toneChars&&cp)ct.setAttribute('class','c t'+sylTone(cp));
  g.style.transform=`translate(${cx}px,${cy}px)`;
  g.addEventListener('click',()=>speak(c));
  requestAnimationFrame(()=>lineEls.forEach(l=>l.style.opacity=1));
  lineEls.forEach(l=>l.style.opacity=0);
  if(!n){const t=el('text',{x:cx,y:cy+90,'text-anchor':'middle','font-size':14,fill:'var(--ink-3)',style:'font-family:var(--ui)'},svg);t.textContent=`No words at ${LVNAME(maxLv)} or below. Raise the level to see more.`}
  $('#caption').innerHTML=n?`<span class="hint">${mode==='words'?'Tap a word to hear it.':'Tap a character to explore it.'} Tap an outer character to travel there.</span>`:'<span class="hint">Try another character, or raise the HSK level below.</span>';
}

/* ---------- words list ---------- */
const openLv=new Set();
function renderWords(){
  const c=cur,o=CH[c];
  $('#wtitle').innerHTML=`Words with <span class="cn">${esc(c)}</span>`;
  $('#lvbar').innerHTML='<span>Show up to</span>'+[1,2,3,4,5,6,7].map(l=>`<button data-lv="${l}" class="${l===maxLv?'on':''}">${l===7?'7–9':l}</button>`).join('');
  $('#wordsPanel').classList.toggle('quiz',quiz);$('#quizbtn').classList.toggle('on',quiz);
  const list=o?o.words.map(i=>WORDS[i]).filter(w=>w.lv<=maxLv):[];
  if(!list.length){$('#wlist').innerHTML=`<p class="empty">${o&&o.words.length?`No words at ${LVNAME(maxLv)} or below.`:`<span class="cn">${esc(c)}</span> doesn’t appear in any HSK word on its own. It works as a building block inside other characters.`}</p>`;return}
  const groups={};list.forEach(w=>(groups[w.lv]??=[]).push(w));
  $('#wlist').innerHTML=Object.keys(groups).sort((a,b)=>a-b).map(lv=>{
    const g=groups[lv],open=openLv.has(c+lv),LIM=10,shown=open?g:g.slice(0,LIM);
    return `<div class="lvgroup"><h3>${LVNAME(+lv)} · ${g.length}</h3>${shown.map(w=>{
      const cw=colorWord(w.w,w);
      return `<div class="wrow" data-w="${esc(w.w)}"><div class="w">${cw.map(({ch,cls})=>`<button data-go="${esc(ch)}" class="${ch===c?'me ':''}${cls}">${esc(ch)}</button>`).join('')}</div>
      <div class="py">${pyHTMLJoined(w.py)}</div><div class="gl">${esc(w.gl)}</div>
      <button class="spk" data-say="${esc(w.w)}" aria-label="Hear ${esc(w.w)}">${SPK}</button></div>`}).join('')}
      ${g.length>LIM?`<button class="linkbtn more" data-more="${lv}">${open?'Show fewer':`Show all ${g.length}`}</button>`:''}</div>`}).join('');
}

/* ---------- families ---------- */
function renderFam(){
  const c=cur,o=CH[c];const secs=[];
  if(o){
    const kids=o.kids.filter(k=>CH[k].lv<=maxLv).slice(0,30);
    if(kids.length)secs.push(`<div><h3 class="sh">Found inside</h3><p class="why">Characters that use <span class="cn">${esc(c)}</span> as a part.</p><div class="chips">${kids.map(k=>charBtn(k)).join('')}</div></div>`);
    if(o.ph){const f=(phonFam[o.ph]||[]).filter(x=>x!==c&&CH[x].lv<=maxLv).sort(byLv).slice(0,24);
      if(f.length)secs.push(`<div><h3 class="sh">Sound family · <span class="cn">${esc(o.ph)}</span></h3><p class="why">These share the sound part ${esc(o.ph)}${CH[o.ph]&&CH[o.ph].py[0]?` (${esc(CH[o.ph].py[0])})`:''}. Compare how close their readings are.</p><div class="chips">${f.map(k=>charBtn(k)).join('')}</div></div>`)}
    const sk=o.se||(o.rad&&o.rad!==c?o.rad:'');
    if(sk){const f=(semFam[sk]||Object.values(CH).filter(x=>x.rad===sk&&x.lv<=7).map(x=>x.c)).filter(x=>x!==c&&CH[x].lv<=maxLv).sort(byLv).slice(0,24);
      if(f.length)secs.push(`<div><h3 class="sh">Meaning family · <span class="cn">${esc(sk)}</span></h3><p class="why">These share the part ${esc(sk)}${CH[sk]?` (${esc((CH[sk].def||'').split(/[;,]/)[0])})`:''}, which often signals a related meaning.</p><div class="chips">${f.map(k=>charBtn(k)).join('')}</div></div>`)}
    // look-alikes: same parts count & share a part, different char
  }
  if(!secs.length)secs.push(`<p class="empty">No close relatives found at this level. Try raising the HSK level.</p>`);
  $('#fam').innerHTML=secs.join('').replace(/<h3 class="sh">/g,'<div class="sect"><h3>').replace(/<\/h3><p/g,'</h3></div><p');
}

/* ---------- trail ---------- */
function renderTrail(){
  $('#trail').innerHTML=`<span class="lab">Trail</span>`+trail.map((c,i)=>`${i?'<span class="arr">›</span>':''}<button class="step cn${c===cur?' cur':''}" data-go="${esc(c)}" data-nopush="1">${esc(c)}</button>`).join('')+
   (trail.length>1?`<button class="linkbtn" id="clearTrail">Clear</button>`:'');
  const t=$('#trail');t.scrollLeft=t.scrollWidth;
}

/* ---------- search ---------- */
let sel=-1,resItems=[];
function search(q){
  q=q.trim();if(!q)return null;
  const chars=[],words=[];
  if(HAN.test(q)){
    const hs=[...q].filter(ch=>HAN.test(ch));
    for(const ch of new Set(hs))if(CH[ch])chars.push(ch);
    for(const w of WORDS){if(w.w.includes(q))words.push(w);if(words.length>=40)break}
    words.sort((a,b)=>(b.w===q)-(a.w===q)||a.lv-b.lv||a.w.length-b.w.length);
  }else{
    const ql=q.toLowerCase();
    const pyq=ql.replace(/[\s']/g,'').replace(/ü|u:/g,'v').normalize('NFD');
    const hasMark=/[\u0300-\u036f]/.test(pyq);
    let nq=pyq,plain=pyq.replace(/[\u0300-\u036f]/g,'');
    const isPy=/^[a-zv]+[1-5]?([a-zv]+[1-5]?)*$/.test(plain.replace(/\d/g,m=>m));
    if(isPy){
      const numeric=/\d/.test(plain);
      const pyMatch=[];
      for(const w of WORDS){
        const hit=numeric?w.nkey.startsWith(plain):w.key.startsWith(plain);
        if(hit)pyMatch.push(w);
      }
      pyMatch.sort((a,b)=>((b.key===plain)||(b.nkey===plain))-((a.key===plain)||(a.nkey===plain))||a.w.length-b.w.length||a.lv-b.lv);
      words.push(...pyMatch.slice(0,25));
      // characters by reading
      const cs=Object.values(CH).filter(o=>o.lv<=7&&o.py.some(p=>{const pl=sylPlain(p).replace(/ü/g,'v');return numeric?pl+sylTone(p)===plain:pl===plain}));
      cs.sort((a,b)=>a.lv-b.lv);chars.push(...cs.slice(0,24).map(o=>o.c));
    }
    if(ql.length>=2&&!/\d/.test(ql)){
      const re=new RegExp('(^|[^a-z])'+ql.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'($|[^a-z])');
      const en=WORDS.filter(w=>re.test(w.glLow)&&!words.includes(w));
      en.sort((a,b)=>{const ai=a.glLow.indexOf(ql),bi=b.glLow.indexOf(ql);return (ai>0)-(bi>0)||a.lv-b.lv||a.w.length-b.w.length});
      words.push(...en.slice(0,25));
      if(!chars.length){const ce=Object.values(CH).filter(o=>o.lv<=7&&re.test(o.def.toLowerCase())).sort((a,b)=>a.lv-b.lv).slice(0,16).map(o=>o.c);chars.push(...ce)}
    }
  }
  return {chars,words:words.slice(0,30)};
}
function showResults(){
  const q=$('#q').value;const r=search(q);const box=$('#results');
  if(!r){box.hidden=true;return}
  sel=-1;resItems=r.words;
  box.innerHTML=(r.chars.length?`<h4>Characters</h4><div class="rchars">${r.chars.map(c=>charBtn(c)).join('')}</div>`:'')+
    (r.words.length?`<h4>Words</h4>${r.words.map((w,i)=>`<button class="rword" data-word="${esc(w.w)}" data-i="${i}"><span class="cn">${esc(w.w)}</span><span class="py">${pyHTMLJoined(w.py)} <span class="pill">${LVNAME(w.lv)}</span></span><span class="gl">${esc(w.gl)}</span></button>`).join('')}`:'')+
    (!r.chars.length&&!r.words.length?`<p class="empty">Nothing matched “${esc(q)}”. Try a character, pinyin like <b>dian</b> or <b>dian4</b>, or an English word.</p>`:'');
  box.hidden=false;
}
function openWord(w){const first=[...w].find(ch=>CH[ch]);closeResults();if(first)go(first,{flashWord:w})}
function closeResults(){$('#results').hidden=true}
$('#q').addEventListener('input',showResults);
$('#q').addEventListener('focus',()=>{if($('#q').value.trim())showResults()});
$('#q').addEventListener('keydown',e=>{
  const rows=[...document.querySelectorAll('.rword')];
  if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();if(!rows.length)return;sel=(sel+(e.key==='ArrowDown'?1:-1)+rows.length)%rows.length;rows.forEach((r,i)=>r.classList.toggle('sel',i===sel));rows[sel].scrollIntoView({block:'nearest'})}
  else if(e.key==='Enter'){const q=$('#q').value.trim();
    if(sel>=0&&rows[sel]){openWord(rows[sel].dataset.word)}
    else{const han=[...q].filter(ch=>HAN.test(ch));if(han.length===1&&CH[han[0]]){closeResults();go(han[0])}else{const f=document.querySelector('#results [data-go],#results .rword');if(f)f.click()}}
    $('#q').blur()}
  else if(e.key==='Escape'){closeResults();$('#q').blur()}
});
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-go],[data-say],[data-word],[data-lv],[data-more],#clearTrail,.gl');
  if(!e.target.closest('.search'))closeResults();
  if(!t)return;
  if(t.id==='clearTrail'){trail=[cur];store.set('trail',trail);renderTrail();return}
  if(t.dataset.go){closeResults();$('#q').value='';go(t.dataset.go,{push:!t.dataset.nopush});if(t.closest('.lower,.card'))window.scrollTo({top:0,behavior:'smooth'});return}
  if(t.dataset.say){speak(t.dataset.say);return}
  if(t.dataset.word){$('#q').value='';openWord(t.dataset.word);return}
  if(t.dataset.lv){maxLv=+t.dataset.lv;store.set('maxLv',maxLv);renderGraph();renderWords();renderFam();return}
  if(t.dataset.more){const k=cur+t.dataset.more;openLv.has(k)?openLv.delete(k):openLv.add(k);renderWords();return}
  if(t.classList.contains('gl')&&t.closest('.quiz')){t.classList.toggle('shown')}
});
$('#quizbtn').onclick=()=>{quiz=!quiz;store.set('quiz',quiz);renderWords()};
$('#tonechars').onclick=()=>{toneChars=!toneChars;store.set('toneChars',toneChars);$('#tonechars').classList.toggle('on',toneChars);renderGraph();renderWords()};
$('#tonechars').classList.toggle('on',toneChars);
const WANDER=Object.values(CH).filter(o=>o.lv<=3&&o.words.length>=3).map(o=>o.c);
$('#wander').onclick=()=>{let c;do{c=WANDER[Math.floor(Math.random()*WANDER.length)]}while(c===cur&&WANDER.length>1);go(c)};

/* theme changes: recolour the writer */
const rewrite=()=>{if(cur)makeWriter(cur)};
try{matchMedia('(prefers-color-scheme: dark)').addEventListener('change',rewrite)}catch(e){}
new MutationObserver(rewrite).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});
let rw;let lastW=innerWidth;addEventListener('resize',()=>{if(Math.abs(innerWidth-lastW)<40)return;lastW=innerWidth;clearTimeout(rw);rw=setTimeout(()=>{renderGraph();makeWriter(cur)},200)});

$('#foot').innerHTML=`${WORDS.length.toLocaleString()} words from the new HSK 3.0 lists (levels 1 to 7–9) and ${Object.keys(CH).length.toLocaleString()} characters and components.
Word data: <a href="https://github.com/drkameleon/complete-hsk-vocabulary" target="_blank" rel="noopener">complete-hsk-vocabulary</a> (definitions from CC-CEDICT, CC BY-SA). Character breakdowns and stroke data: <a href="https://github.com/skishore/makemeahanzi" target="_blank" rel="noopener">Make Me a Hanzi</a>, drawn with <a href="https://hanziwriter.org" target="_blank" rel="noopener">Hanzi Writer</a>. Audio uses your browser’s built-in Mandarin voice when one is installed.`;

/* start */
let start=null;
const h=location.hash.match(/^#u([0-9a-f]{4,5})$/i);
if(h){const ch=String.fromCodePoint(parseInt(h[1],16));if(CH[ch])start=ch}
start=start||store.get('last',null);if(!start||!CH[start])start='电';
go(start,{push:!trail.includes(start)||trail[trail.length-1]!==start});
})();
</script>
